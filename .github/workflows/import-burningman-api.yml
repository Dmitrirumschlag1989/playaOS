name: Import Burning Man API
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch official Burning Man data
        env:
          BURNING_MAN_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
          BURNING_MAN_YEAR: '2026'
        run: python scripts/import_burningman_api.py
      - name: Commit changed data
        run: |
          git config user.name 'PlayaOS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/api
          git diff --cached --quiet || git commit -m 'chore: refresh official Burning Man API data'
          git push
