background:#fbf8f2dd;border:1px solid #ded3c4;border-radius:999px;padding:7px 11px;font-size:11px;color:#81776d;pointer-events:none;backdrop-filter:blur(8px)}.gisStreet{fill:none;stroke:#b6aa9d;stroke-width:1.2}.gisAvenue{fill:none;stroke:#8f8071;stroke-width:2.8}.gisPlaza{fill:#e3d7c8;stroke:#c9b9a7;stroke-width:1}.gisFence{fill:none;stroke:#b7a897;stroke-width:2;stroke-dasharray:6 5}.gisLabel{font-size:10px;font-weight:700;fill:#75695f}.gisPoi{fill:#8f7b68}.eventHalo{fill:#bd554f20;stroke:#bd554f55;stroke-width:1}.event{fill:#bd554f;stroke:#fff;stroke-width:2}.eventText{font-size:10px;font-weight:700;fill:#352f2a;paint-order:stroke;stroke:#fbf8f2;stroke-width:3px}.centerLabel{font-size:13px;font-weight:800;fill:#75695f;letter-spacing:.5px}</style></head><body><div id="wrap"><svg id="map" viewBox="0 0 1000 760" aria-label="Official Black Rock City 2026 GIS map"></svg><div class="controls"><button class="control" id="back">← My Playa</button><button class="control" id="fit">Fit City</button><button class="control" id="fitEvents">Fit My Events</button><button class="control" id="minus">−</button><button class="control" id="plus">+</button><span class="status" id="status">Loading official GIS…</span></div><div class="hint" id="hint">Drag to pan · pinch or +/− to zoom</div><div class="legend"><strong>BLACK ROCK CITY · 2026</strong><br><span><i class="dot"></i>Saved event · exact GIS intersection</span></div><div id="tbd" class="tbd"></div><div id="popup" class="popup"></div></div><script src="api-config.js?v=20260824-1"></script><script src="api-bridge.js?v=20260823-2"></script><script>
const svg=document.getElementById('map'),status=document.getElementById('status'),popup=document.getElementById('popup'),tbd=document.getElementById('tbd'),hint=document.getElementById('hint'),NS='http://www.w3.org/2000/svg';const GIS='https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/master/2026/GeoJSON/';const URLS={streets:GIS+'street_lines.geojson',plazas:GIS+'plazas.geojson',fence:GIS+'trash_fence.geojson',cpns:GIS+'cpns.geojson'};let events=[],chosen=[],view={x:0,y:0,w:1000,h:760},bounds=null,drag=null,streetFeatures=[];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const selectedIds=()=>{try{return new Set(JSON.parse(localStorage.getItem('playa_selected')||'[]'))}catch{return new Set()}};function add(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}function coords(g,out=[]){if(!g)return out;if(g.type==='Point')out.push(g.coordinates);else if(g.coordinates)g.coordinates.forEach(x=>Array.isArray(x)&&typeof x[0]==='number'?out.push(x):coords({coordinates:x},out));return out}function collect(fc){const a=[];(fc.features||[]).forEach(f=>coords(f.geometry,a));return a}function updateBounds(fcs){const pts=fcs.flatMap(collect);if(!pts.length)return;let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;pts.forEach(([x,y])=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)});const dx=(maxx-minx)*.04,dy=(maxy-miny)*.04;bounds=[minx-dx,miny-dy,maxx+dx,maxy+dy]}function project(c){if(!bounds)return null;const[minx,miny,maxx,maxy]=bounds;return{x:70+(c[0]-minx)/(maxx-minx)*860,y:690-(c[1]-miny)/(maxy-miny)*620}}function pathFor(g){if(!g)return'';if(g.type==='LineString')return'M '+g.coordinates.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ');if(g.type==='Polygon')return g.coordinates.map(r=>r.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ')+' Z').join(' ');if(g.type==='MultiLineString')return g.coordinates.map(r=>'M '+r.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ')).join(' ');if(g.type==='MultiPolygon')return g.coordinates.flatMap(p=>p.map(r=>r.map(c=>{const q=project(c);return q?`${q.x} ${q.y}`:''}).filter(Boolean).join(' L ')+' Z')).join(' ');return''}function renderGeo(fc,type){(fc.features||[]).forEach(f=>{const d=pathFor(f.geometry),p=f.properties||{};if(!d)return;if(type==='street')add('path',{d,class:p.kind==='avenue'?'gisAvenue':'gisStreet'});else if(type==='plaza')add('path',{d,class:'gisPlaza'});else if(type==='fence')add('path',{d,class:'gisFence'});else if(type==='cpn'){const pts=collect(f);if(pts[0]){const q=project(pts[0]);add('circle',{cx:q.x,cy:q.y,r:2.5,class:'gisPoi'});if(p.name){const t=add('text',{x:q.x+5,y:q.y+3,class:'gisLabel'});t.textContent=p.name}}}})}function normName(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,' ')}function segmentIntersection(a,b,c,d){const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]],den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-14)return null;const q=[c[0]-a[0],c[1]-a[1]],t=(q[0]*s[1]-q[1]*s[0])/den,u=(q[0]*r[1]-q[1]*r[0])/den;if(t>=-1e-9&&t<=1+1e-9&&u>=-1e-9&&u<=1+1e-9)return[a[0]+t*r[0],a[1]+t*r[1]];return null}function geometrySegments(g){const out=[];if(!g)return out;const lines=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];lines.forEach(line=>{for(let i=1;i<line.length;i++)out.push([line[i-1],line[i]])});return out}function exactIntersection(nameA,nameB){const A=streetFeatures.filter(f=>normName(f.properties?.name)===normName(nameA)),B=streetFeatures.filter(f=>normName(f.properties?.name)===normName(nameB));if(!A.length||!B.length)return null;const sa=A.flatMap(f=>geometrySegments(f.geometry)),sb=B.flatMap(f=>geometrySegments(f.geometry));for(const a of sa)for(const b of sb){const p=segmentIntersection(a[0],a[1],b[0],b[1]);if(p)return p}return null}function parseLocation(loc){let s='';if(typeof loc==='string')s=loc;else if(loc&&typeof loc==='object')s=loc.location_string||loc.location||((loc.frontage&&loc.intersection)?`${loc.frontage} ${loc.intersection_type||'&'} ${loc.intersection}`:'');s=String(s||'').replace(/\s+/g,' ').trim();if(!s)return null;if(/center camp|center camp plaza|the man|man plaza/i.test(s))return{coord:[-119.207871,40.783242],accuracy:'exact'};const m=s.match(/(?:^|\b)(\d{1,2}(?::\d{2})?)\s*(?:&|and|at)\s*([A-K])\b/i)||s.match(/(?:^|\b)([A-K])\s*(?:&|and|at)\s*(\d{1,2}(?::\d{2})?)(?:\b|$)/i);if(m){const time=/^\d/.test(m[1])?m[1]:m[2],letter=/^\d/.test(m[1])?m[2]:m[1],h=String(time).includes(':')?time:`${Number(time)}:00`,p=exactIntersection(h,letter);if(p)return{coord:p,accuracy:'exact',label:`${h} & ${letter}`}}const parts=s.split(/\s*(?:&|\band\b|@)\s*/i);if(parts.length>=2){const p=exactIntersection(parts[0],parts[1])||exactIntersection(parts[1],parts[0]);if(p)return{coord:p,accuracy:'exact',label:`${parts[0]} & ${parts[1]}`}}return null}function eventPoint(e){const r=parseLocation(e.location||e.location_string||e.location_data||e.other_location);if(!r)return null;const p=project(r.coord);return p?{...p,accuracy:r.accuracy,label:r.label}:null}function marker(e,p){const g=add('g',{class:'marker'});add('circle',{cx:p.x,cy:p.y,r:16,class:'eventHalo'},g);add('circle',{cx:p.x,cy:p.y,r:8,class:'event'},g);const t=add('text',{x:p.x+12,y:p.y+4,class:'eventText'},g);t.textContent=(e.title||'Event').slice(0,30);g.addEventListener('click',ev=>{ev.stopPropagation();popup.innerHTML=`<strong>${esc(e.title)}</strong><small>📍 ${esc(e.location||e.camp||p.label||'Exact GIS location')}</small><small>${esc(e.date)} · ${esc(e.start)}–${esc(e.end||e.start)}</small><button id="closePopup" type="button">Close</button>`;popup.style.display='block';popup.style.left='50%';popup.style.top='62px';popup.style.transform='translateX(-50%)';popup.querySelector('#closePopup').onclick=()=>popup.style.display='none'})}function renderEvents(){svg.querySelectorAll('.marker,.centerLabel').forEach(n=>n.remove());const ids=selectedIds();chosen=[];let missing=[];events.forEach(e=>{if(!ids.has(e.id))return;const p=eventPoint(e);if(p){chosen.push({...e,...p});marker(e,p)}else missing.push(e)});const center=project([-119.207871,40.783242]);if(center){const c=add('text',{x:center.x-36,y:center.y+4,class:'centerLabel'});c.textContent='CENTER CAMP'}status.textContent=`Official GIS · ${chosen.length}/${ids.size} events mapped${missing.length?' · '+missing.length+' location TBD':''}`;tbd.style.display=missing.length?'block':'none';tbd.innerHTML=missing.length?'<strong>Location TBD</strong>'+missing.map(e=>`<div>${esc(e.title)}</div>`).join(''):'';if(chosen.length)hint.style.display='none'}function apply(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function fitCity(){view={x:0,y:0,w:1000,h:760};apply()}function fitEvents(){if(!chosen.length){fitCity();return}const xs=chosen.map(p=>p.x),ys=chosen.map(p=>p.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),pad=100;let w=Math.max(300,maxx-minx+pad*2),h=Math.max(240,maxy-miny+pad*2);w=Math.min(1000,w);h=Math.min(760,h);view={x:minx+(maxx-minx)/2-w/2,y:miny+(maxy-miny)/2-h/2,w,h};view.x=Math.max(0,Math.min(1000-view.w,view.x));view.y=Math.max(0,Math.min(760-view.h,view.y));apply()}function zoomAt(f,cx=500,cy=380){const nw=Math.max(220,Math.min(1000,view.w*f)),nh=Math.max(180,Math.min(760,view.h*f)),sx=(cx-view.x)/view.w,sy=(cy-view.y)/view.h;view.x=cx-sx*nw;view.y=cy-sy*nh;view.w=nw;view.h=nh;view.x=Math.max(0,Math.min(1000-nw,view.x));view.y=Math.max(0,Math.min(760-nh,view.y));apply()}function svgPoint(clientX,clientY){const r=svg.getBoundingClientRect();return{x:view.x+(clientX-r.left)/r.width*view.w,y:view.y+(clientY-r.top)/r.height*view.h}}document.getElementById('fit').onclick=fitCity;document.getElementById('fitEvents').onclick=fitEvents;document.getElementById('plus').onclick=()=>zoomAt(.8);document.getElementById('minus').onclick=()=>zoomAt(1.25);document.getElementById('back').onclick=()=>window.parent.postMessage({type:'show-itinerary'},'*');svg.addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;drag={start:svgPoint(e.clientX,e.clientY),x:view.x,y:view.y};svg.classList.add('dragging');svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPoint(e.clientX,e.clientY);view.x=drag.x+(drag.start.x-p.x);view.y=drag.y+(drag.start.y-p.y);view.x=Math.max(0,Math.min(1000-view.w,view.x));view.y=Math.max(0,Math.min(760-view.h,view.y));apply()});svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});svg.addEventListener('pointercancel',()=>{drag=null;svg.classList.remove('dragging')});svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.12:.89,p.x,p.y)},{passive:false});window.addEventListener('storage',renderEvents);window.addEventListener('message',e=>{if(e.data?.type==='refresh-map'){renderEvents();setTimeout(fitEvents,0)}if(e.data?.type==='fit')fitCity()});svg.addEventListener('click',()=>popup.style.display='none');(async()=>{try{const[street,plaza,fence,cpn,er]=await Promise.all([fetch(URLS.streets).then(r=>r.json()),fetch(URLS.plazas).then(r=>r.json()),fetch(URLS.fence).then(r=>r.json()),fetch(URLS.cpns).then(r=>r.json()),fetch('./data/events.json',{cache:'no-store'}).then(r=>r.json())]);streetFeatures=street.features||[];updateBounds([street,fence,plaza]);svg.innerHTML='';add('rect',{x:0,y:0,width:1000,height:760,fill:'#eee5d9'});renderGeo(fence,'fence');renderGeo(plaza,'plaza');renderGeo(street,'street');renderGeo(cpn,'cpn');events=Array.isArray(er)?er:(er.events||er.data||[]);renderEvents();fitCity();if(selectedIds().size)fitEvents();const apiOk=window.PLAYA_API?await window.PLAYA_API.health():false;status.textContent=`Official GIS · API ${apiOk?'connected':'offline'} · ${chosen.length}/${selectedIds().size} events mapped`;}catch(e){console.error(e);status.textContent='Official GIS unavailable';fitCity()}})();</script></body></html>
