<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee5d9"><title>Black Rock City 2026 Map</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352f2a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eee5d9}#wrap{height:100%;position:relative;background:#eee5d9}#map{width:100%;height:100%;display:block;touch-action:none;background:#eee5d9}#controls{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.control,.status{background:#fbf8f2;border:1px solid #ded3c4;border-radius:12px;padding:9px 11px;font-weight:700;color:#352f2a;box-shadow:0 3px 14px #3b302814}.status{font-size:12px;font-weight:600;color:#81776d;margin-left:auto}.legend{position:absolute;z-index:5;left:12px;bottom:12px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:10px 12px;font-size:12px;box-shadow:0 3px 14px #3b302814}.legend b{margin-right:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bd554f;border:2px solid #fff;box-shadow:0 0 0 1px #bd554f;margin-right:5px}.popup{position:absolute;z-index:8;display:none;min-width:220px;max-width:300px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:15px;padding:13px;box-shadow:0 10px 40px #3b302833}.popup strong{display:block;line-height:1.25}.popup small{display:block;color:#81776d;margin-top:5px}.popup button{margin-top:9px;border:1px solid #ded3c4;border-radius:10px;background:#eee5d9;padding:7px 10px}.tbd{position:absolute;z-index:5;right:12px;bottom:12px;max-width:260px;max-height:120px;overflow:auto;background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:9px 11px;font-size:11px;color:#81776d;display:none}.tbd div{padding-top:4px}.streetName{font-size:10px;font-weight:700;letter-spacing:.04em;fill:#75695f}.radialName{font-size:10px;font-weight:700;fill:#81776d}.plaza{fill:#e1d4c3;stroke:#c8b8a4;stroke-width:1}.block{fill:#e8ddd0;stroke:#d8cabb;stroke-width:1}.major{stroke:#a99b8c}.minor{stroke:#c9bdb0}.event{fill:#bd554f;stroke:#fff;stroke-width:2}.eventText{font-size:10px;font-weight:700;fill:#352f2a;paint-order:stroke;stroke:#fbf8f2;stroke-width:3px;stroke-linejoin:round}</style></head><body><div id="wrap"><svg id="map" viewBox="0 0 1000 760" aria-label="Black Rock City 2026 map"></svg><div id="controls"><button class="control" id="back">← My Playa</button><button class="control" id="fit">Fit City</button><button class="control" id="fitEvents">Fit My Events</button><button class="control" id="minus">−</button><button class="control" id="plus">+</button><span class="status" id="status">Loading map…</span></div><div class="legend"><b>2026 BLACK ROCK CITY</b><span><i class="dot"></i>My Events</span></div><div id="tbd" class="tbd"></div><div id="popup" class="popup"></div></div><script src="api-bridge.js?v=20260823-2"></script><script>
const svg=document.getElementById('map'),status=document.getElementById('status'),popup=document.getElementById('popup'),tbd=document.getElementById('tbd');
let view={x:0,y:0,w:1000,h:760};let events=[];let chosen=[];
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const selectedIds=()=>{try{return new Set(JSON.parse(localStorage.getItem('playa_selected')||'[]'))}catch{return new Set()}};
function radius(letter){const s=String(letter||'').toUpperCase().trim();const i='ABCDEFGHIJK'.indexOf(s.charAt(0));return i<0?.85:.19+i*.075}
function clockValue(v){const m=String(v||'').match(/(\d{1,2})(?::(\d{2}))?/);if(!m)return null;return(Number(m[1])%12)+(Number(m[2]||0)/60)}
function gridPoint(loc){if(!loc)return null;let s='';if(typeof loc==='string')s=loc;else if(loc&&typeof loc==='object'){if(loc.location_string)s=String(loc.location_string);else if(loc.frontage&&loc.intersection)s=`${loc.frontage} ${loc.intersection_type||'&'} ${loc.intersection}`;else if(loc.hour!==undefined)s=`${loc.hour}:${String(loc.minute||0).padStart(2,'0')}`}
s=s.replace(/\s+/g,' ').trim();if(/center camp|center camp plaza|the man|man plaza/i.test(s))return{x:500,y:380};const a=s.match(/(\d{1,2}(?::\d{2})?)\s*(?:&|and|at)\s*([A-K])\b/i),b=s.match(/([A-K])\s*(?:&|and|at)\s*(\d{1,2}(?::\d{2})?)/i),f=s.match(/(?:esplanade|ararat|iroko|jiba|kundalini|heiau|fulcrum|k)\s*(?:&|at)\s*(\d{1,2}(?::\d{2})?)/i);let h=null,r=.55;if(a){h=clockValue(a[1]);r=radius(a[2])}else if(b){h=clockValue(b[2]);r=radius(b[1])}else if(f){h=clockValue(f[1]);r=/esplanade/i.test(s)?.13:.55}if(h===null)return null;const ang=(h*30-90)*Math.PI/180;return{x:500+330*r*Math.cos(ang),y:380+270*r*Math.sin(ang)}}
function add(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);parent.appendChild(e);return e}
function drawBase(){svg.innerHTML='';const g=add('g',{id:'scene'});add('rect',{x:0,y:0,width:1000,height:760,fill:'#eee5d9'},g);add('polygon',{points:'150,135 850,135 930,380 850,625 150,625 70,380',fill:'#e9dfd3',stroke:'#c9bdb0','stroke-width':2},g);for(let i=0;i<7;i++){const y=170+i*65;add('path',{d:`M 210 ${y} Q 500 ${y-18} 790 ${y}`,class:'minor',fill:'none','stroke-width':1},g)}for(let i=0;i<6;i++){const y=210+i*70;add('path',{d:`M 190 ${y} Q 500 ${y+18} 810 ${y}`,class:'major',fill:'none','stroke-width':2},g)}for(let i=0;i<10;i++){const rr=55+i*28;add('circle',{cx:500,cy:380,r:rr,class:i%3===0?'major':'minor',fill:'none','stroke-width':i%3===0?2:1},g)}const names=['Esplanade','Ararat','Iroko','Jiba','Kundalini','Heiau','G'];names.forEach((n,i)=>{const rr=72+i*45;add('circle',{cx:500,cy:380,r:rr,class:'street',fill:'none','stroke-width':1},g);});for(let h=0;h<12;h++){const ang=(h*30-90)*Math.PI/180;const x2=500+365*Math.cos(ang),y2=380+300*Math.sin(ang);add('line',{x1:500,y1:380,x2,y2,class:h%2?'minor':'major','stroke-width':h%2?1:2},g);const t=add('text',{x:500+385*Math.cos(ang),y:380+315*Math.sin(ang),'text-anchor':'middle',class:'radialName'},g);t.textContent=(h||12)+':00'}const c=add('ellipse',{cx:500,cy:380,rx:46,ry:32,fill:'#e1d4c3',stroke:'#c8b8a4','stroke-width':2},g);const ct=add('text',{x:500,y:384,'text-anchor':'middle',class:'streetName'},g);ct.textContent='CENTER CAMP';const man=add('circle',{cx:500,cy:380,r:16,fill:'#d5c4af',stroke:'#aa9a86'} ,g);const mt=add('text',{x:500,y:414,'text-anchor':'middle',class:'streetName'},g);mt.textContent='THE MAN';['3:00','4:30','6:00','7:30','9:00'].forEach((clock,i)=>{const h=clockValue(clock),a=(h*30-90)*Math.PI/180,x=500+210*Math.cos(a),y=380+170*Math.sin(a);add('rect',{x:x-25,y:y-18,width:50,height:36,rx:8,class:'plaza'},g);const t=add('text',{x,y:y+3,'text-anchor':'middle',class:'streetName'},g);t.textContent=clock+' PLAZA'});['A','B','C','D','E','F','G','H','I','J','K'].forEach((n,i)=>{const rr=120+i*23;const t=add('text',{x:500+rr,y:132,'text-anchor':'middle',class:'streetName'},g);t.textContent=n})}
function marker(e,p){const g=add('g',{class:'marker'});const c=add('circle',{cx:p.x,cy:p.y,r:9,class:'event'},g);const t=add('text',{x:p.x+12,y:p.y+4,class:'eventText'},g);t.textContent=(e.title||'Event').slice(0,28);g.addEventListener('click',ev=>{ev.stopPropagation();popup.innerHTML=`<strong>${esc(e.title)}</strong><small>📍 ${esc(e.location||e.camp||'Approximate location')}</small><small>${esc(e.date)} · ${esc(e.start)}–${esc(e.end||e.start)}</small><button>Close</button>`;popup.style.display='block';popup.style.left='50%';popup.style.top='70px';popup.style.transform='translateX(-50%)';popup.querySelector('button').onclick=()=>popup.style.display='none'})}
function render(){drawBase();chosen=[];const ids=selectedIds();let missing=[];for(const e of events){if(!ids.has(e.id))continue;const loc=e.location||e.location_string||e.location_data||e.other_location||'',p=gridPoint(loc);if(p){chosen.push({...e,...p});marker(e,p)}else missing.push(e)}status.textContent=ids.size?`${ids.size} selected · ${chosen.length} mapped${missing.length?' · '+missing.length+' TBD':''}`:'Select events from Explore to map them';tbd.style.display=missing.length?'block':'none';tbd.innerHTML=missing.length?'<b>Location TBD</b>'+missing.map(e=>`<div>${esc(e.title)}</div>`).join(''):'';applyView()}
function applyView(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function fitCity(){view={x:0,y:0,w:1000,h:760};applyView()}
function fitEvents(){if(!chosen.length){fitCity();return}const xs=chosen.map(p=>p.x),ys=chosen.map(p=>p.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),pad=90;view={x:Math.max(0,minx-pad),y:Math.max(0,miny-pad),w:Math.min(1000,Math.max(280,maxx-minx+pad*2)),h:Math.min(760,Math.max(220,maxy-miny+pad*2))};if(view.x+view.w>1000)view.x=1000-view.w;if(view.y+view.h>760)view.y=760-view.h;applyView()}
function zoom(f){const nw=view.w*f,nh=view.h*f;view.x+=(view.w-nw)/2;view.y+=(view.h-nh)/2;view.w=Math.max(220,Math.min(1000,nw));view.h=Math.max(170,Math.min(760,nh));view.x=Math.max(0,Math.min(1000-view.w,view.x));view.y=Math.max(0,Math.min(760-view.h,view.y));applyView()}
document.getElementById('fit').onclick=fitCity;document.getElementById('fitEvents').onclick=fitEvents;document.getElementById('plus').onclick=()=>zoom(.8);document.getElementById('minus').onclick=()=>zoom(1.25);document.getElementById('back').onclick=()=>window.parent.postMessage({type:'show-itinerary'},'*');svg.addEventListener('click',()=>popup.style.display='none');window.addEventListener('storage',render);window.addEventListener('message',e=>{if(e.data?.type==='refresh-map')render()});
(async()=>{try{const r=await fetch('./data/events.json',{cache:'no-store'});const j=await r.json();events=Array.isArray(j)?j:(j.events||j.data||[]);render()}catch(e){status.textContent='Map data unavailable';drawBase()}})();
</script></body></html>
