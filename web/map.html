<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Playa Companion Map</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#352f2a}html,body{margin:0;height:100%;background:#eee5d9}#wrap{height:100%;position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;background:#eee5d9}#bar{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#bar button,#bar a{background:#fbf8f2;color:#352f2a;border:1px solid #ded3c4;border-radius:14px;padding:10px 12px;text-decoration:none;font-weight:700;box-shadow:0 3px 12px #6b58420d}#status{background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:10px;color:#81776d;font-size:12px}.legend{position:absolute;z-index:5;bottom:12px;left:12px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:16px;padding:10px;font-size:12px;box-shadow:0 3px 12px #6b58420d}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.event{fill:#6f93a7}.unlocated{fill:#a7a09a}.ring{fill:none;stroke:#cfc2b3}.street{stroke:#b7aa9b}.label{font-size:12px;fill:#75695f}.popup{position:absolute;z-index:8;display:none;min-width:210px;max-width:280px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:16px;padding:12px;box-shadow:0 10px 40px #3b302833}.popup strong{display:block}.popup small{display:block;color:#81776d;margin-top:4px}.popup button{margin-top:8px;border:1px solid #ded3c4;border-radius:12px;background:#eee5d9;padding:8px 10px}</style></head><body><div id="wrap"><svg id="map" viewBox="0 0 1000 760" aria-label="Approximate Black Rock City map"></svg><div id="bar"><a href="./index.html">← Playa Companion</a><button id="fit">Fit Playa</button><span id="status">Loading…</span></div><div class="legend"><span><i class="dot event"></i>My Events</span> &nbsp; <span><i class="dot unlocated"></i>Location TBD</span></div><div id="popup" class="popup"></div></div><script>
const svg=document.getElementById('map'),status=document.getElementById('status'),popup=document.getElementById('popup');const selectedIds=()=>{const q=new URLSearchParams(location.search).get('selected');if(q!==null)return new Set(q.split(',').filter(Boolean));try{return new Set(JSON.parse(localStorage.getItem('playa_selected')||'[]'))}catch{return new Set()}};function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function radius(letter){const i='ABCDEFGHIJKLMN'.indexOf(String(letter||'').toUpperCase().charAt(0));return i<0?.82:.28+i*.045}function gridPoint(loc){const m=String(loc||'').match(/(\d{1,2})(?::\d{2})?\s*(?:&|and|at)\s*([A-N])/i);if(!m)return null;const h=Number(m[1])%12,a=(h*30-90)*Math.PI/180,r=radius(m[2]);return{x:500+330*r*Math.cos(a),y:380+270*r*Math.sin(a)}}
function drawBase(){svg.innerHTML='';const ns='http://www.w3.org/2000/svg';const add=(n,a={})=>{const x=document.createElementNS(ns,n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));svg.appendChild(x);return x};add('rect',{x:0,y:0,width:1000,height:760,fill:'#eee5d9'});for(let i=1;i<=10;i++)add('circle',{cx:500,cy:380,r:45+i*25,class:'ring'});for(let h=0;h<12;h++){const a=(h*30-90)*Math.PI/180;add('line',{x1:500,y1:380,x2:500+330*Math.cos(a),y2:380+270*Math.sin(a),class:'street'});const t=add('text',{x:500+350*Math.cos(a),y:380+290*Math.sin(a),'text-anchor':'middle',class:'label'});t.textContent=(h||12)+':00'}const c=add('text',{x:500,y:385,'text-anchor':'middle',class:'label'});c.textContent='CENTER CAMP'}
function marker(p){const ns='http://www.w3.org/2000/svg',c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',p.selected?9:6);c.setAttribute('class',p.selected?'event':'unlocated');c.addEventListener('click',ev=>{ev.stopPropagation();popup.innerHTML=`<strong>${esc(p.title)}</strong><small>📍 ${esc(p.location||'Location TBD')}</small><small>${esc(p.date)} · ${esc(p.start)}</small><button>Close</button>`;popup.style.display='block';popup.style.left=Math.min(Math.max(p.x/10,4),70)+'%';popup.style.top=Math.min(Math.max(p.y/7.6,12),72)+'%';popup.querySelector('button').onclick=()=>popup.style.display='none'});svg.appendChild(c)}
async function load(){drawBase();try{const r=await fetch('./data/events.json',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json(),events=Array.isArray(j)?j:(j.events||j.data||[]),sel=selectedIds();const chosen=events.filter(e=>sel.has(e.id));let mapped=0;chosen.forEach(e=>{const loc=e.location||e.location_string||e.other_location||'',p=gridPoint(loc);if(p){mapped++;marker({...e,location:loc,...p,selected:true})}});status.textContent=chosen.length?`${chosen.length} selected · ${mapped} mapped · ${chosen.length-mapped} location TBD`:'Select events from Explore to map them'}catch(e){status.textContent='Map base loaded · event data unavailable'}}
document.getElementById('fit').onclick=()=>{svg.setAttribute('viewBox','0 0 1000 760');popup.style.display='none'};svg.addEventListener('click',()=>popup.style.display='none');window.addEventListener('storage',load);window.addEventListener('message',e=>{if(e.data?.type==='fit'||e.data?.type==='refresh')load()});load();</script></body></html>
