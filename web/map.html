<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>PlayaOS Map</title><style>html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}#map{height:100%;width:100%;background:#171717}#bar{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#bar a,#bar button{background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:700}#status{background:#222;border:1px solid #444;border-radius:12px;padding:10px;color:#bbb;font-size:12px}.legend{position:fixed;z-index:5;bottom:12px;left:12px;background:#222;border:1px solid #444;border-radius:14px;padding:10px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.camp{background:#e8b84a}.art{background:#d77aff}.event{background:#5fb8ff}.mv{background:#ff6d6d}</style></head><body><div id="map"></div><div id="bar"><a href="./index.html">← PlayaOS</a><button id="fit">Fit Playa</button><span id="status">Loading map…</span></div><div class="legend"><span><i class="dot camp"></i>Camps</span> &nbsp; <span><i class="dot art"></i>Art</span> &nbsp; <span><i class="dot event"></i>Events</span> &nbsp; <span><i class="dot mv"></i>Mutant Vehicles</span></div><script type="module">
const status=document.querySelector('#status');const map=document.querySelector('#map');
const d3=await import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm');
const width=()=>map.clientWidth,height=()=>map.clientHeight;
const svg=d3.select(map).append('svg').attr('width','100%').attr('height','100%').style('touch-action','none');
const g=svg.append('g');
const projection=d3.geoMercator();const path=d3.geoPath(projection);
let layers=[];
async function loadGeo(){
 const urls={streets:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/street_lines.geojson',outline:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/trash_fence.geojson',plazas:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/plazas.geojson'};
 const data={};for(const [k,u] of Object.entries(urls)){try{const r=await fetch(u);if(r.ok)data[k]=await r.json()}catch{}}
 return data;
}
function pointsFromRecords(arr,type){return (arr||[]).flatMap(x=>{const l=x.location||{};const lat=l.gps_latitude,lon=l.gps_longitude;if(typeof lat!=='number'||typeof lon!=='number')return[];return [{lat,lon,type,name:x.name||x.title||x.artist||'Unnamed',details:x.location_string||x.description||''}]})}
async function loadRecords(){const out=[];for(const [file,type] of [['camps','camp'],['art','art'],['events','event'],['mutant_vehicles','mv']]){try{const r=await fetch(`./data/api/${file}.json`,{cache:'no-store'});if(!r.ok)continue;const d=await r.json();const a=Array.isArray(d)?d:(d.results||[]);out.push(...pointsFromRecords(a,type))}catch{}}return out}
function fitAll(geo,pts){const coords=[];for(const f of Object.values(geo||{})){if(f?.features)coords.push(...f.features.flatMap(f=>{const b=d3.geoBounds(f);return [[b[0][0],b[0][1]],[b[1][0],b[1][1]]] }))}coords.push(...pts.map(p=>[p.lon,p.lat]));if(!coords.length)return;const fc={type:'FeatureCollection',features:coords.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:c}}))};projection.fitExtent([[24,70],[width()-24,height()-24]],fc);}
function draw(geo,pts){g.selectAll('*').remove();for(const [k,v] of Object.entries(geo||{})){if(!v?.features)continue;g.append('g').selectAll('path').data(v.features).join('path').attr('d',path).attr('fill',k==='plazas'?'#222':'none').attr('stroke','#777').attr('stroke-width',k==='streets'?1:1.5).attr('opacity',k==='streets'?.55:.7)}const groups={camp:[],art:[],event:[],mv:[]};pts.forEach(p=>groups[p.type]?.push(p));for(const [type,a] of Object.entries(groups)){g.append('g').selectAll('circle').data(a).join('circle').attr('cx',p=>projection([p.lon,p.lat])[0]).attr('cy',p=>projection([p.lon,p.lat])[1]).attr('r',type==='event'?3:5).attr('fill',type==='camp'?'#e8b84a':type==='art'?'#d77aff':type==='mv'?'#ff6d6d':'#5fb8ff').attr('stroke','#111').attr('stroke-width',1).append('title').text(p=>p.name+' — '+p.details)}status.textContent=`${pts.length} mapped records • ${navigator.onLine?'Online':'Offline'}`}
const geo=await loadGeo();const pts=await loadRecords();fitAll(geo,pts);draw(geo,pts);document.querySelector('#fit').onclick=()=>{fitAll(geo,pts);draw(geo,pts)};let tx=0,ty=0,k=1;svg.call(d3.zoom().scaleExtent([.5,20]).on('zoom',e=>g.attr('transform',e.transform)));</script></body></html>
