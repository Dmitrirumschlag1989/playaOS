<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eee5"><title>Playa Companion Map</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#352f2a}html,body{margin:0;height:100%;background:#f4eee5;color:#352f2a}#map{height:100%;width:100%;background:#eee5d9}#bar{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#bar a,#bar button{background:#fbf8f2;color:#352f2a;border:1px solid #ded3c4;border-radius:14px;padding:10px 12px;text-decoration:none;font-weight:700;box-shadow:0 3px 12px #6b58420d}#status{background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:10px;color:#81776d;font-size:12px}.legend{position:fixed;z-index:5;bottom:12px;left:12px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:16px;padding:10px;font-size:12px;box-shadow:0 3px 12px #6b58420d}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.camp{background:#b58b64}.art{background:#9a79a9}.event{background:#6f93a7}.mv{background:#b96e63}.selected{stroke:#352f2a;stroke-width:2.5px}</style></head><body><div id="map"></div><div id="bar"><a href="./index.html">← Playa Companion</a><button id="fit">Fit Playa</button><span id="status">Loading map…</span></div><div class="legend"><span><i class="dot camp"></i>Camps</span> &nbsp; <span><i class="dot art"></i>Art</span> &nbsp; <span><i class="dot event"></i>My Events</span> &nbsp; <span><i class="dot mv"></i>Mutant Vehicles</span></div><script type="module">
const status=document.querySelector('#status'),map=document.querySelector('#map');
const d3=await import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm');
const width=()=>map.clientWidth,height=()=>map.clientHeight;const svg=d3.select(map).append('svg').attr('width','100%').attr('height','100%').style('touch-action','none');const g=svg.append('g');const projection=d3.geoMercator();const path=d3.geoPath(projection);let currentGeo={},currentPts=[];
function selectedIds(){const q=new URLSearchParams(location.search).get('selected');if(q!==null)return new Set(q.split(',').filter(Boolean));try{return new Set(JSON.parse(localStorage.getItem('playa_selected')||'[]'))}catch{return new Set()}}
function selectedUids(){const out=new Set();for(const id of selectedIds()){const m=String(id).match(/^bm-(.*)-\d{4}-\d{2}-\d{2}T/);if(m)out.add(m[1])}return out}
async function loadGeo(){const urls={streets:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/street_lines.geojson',outline:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/trash_fence.geojson',plazas:'https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/main/2026/GeoJSON/plazas.geojson'};const data={};for(const[k,u]of Object.entries(urls)){try{const r=await fetch(u);if(r.ok)data[k]=await r.json()}catch{}}return data}
function pointsFromRecords(arr,type,selectedOnly=false){const su=selectedUids();return(arr||[]).flatMap(x=>{if(type==='event'&&selectedOnly&&su.size&&!su.has(String(x.uid||x.event_id)))return[];const l=x.location||{};const lat=l.gps_latitude,lon=l.gps_longitude;if(typeof lat!=='number'||typeof lon!=='number')return[];return[{lat,lon,type,name:x.name||x.title||x.artist||'Unnamed',details:x.location_string||x.description||'',selected:type==='event'}]})}
async function loadRecords(){const out=[];const selected=selectedIds();for(const[file,type]of[['camps','camp'],['art','art'],['events','event'],['mutant_vehicles','mv']]){try{const r=await fetch(`./data/api/${file}.json`,{cache:'no-store'});if(!r.ok)continue;const d=await r.json();const a=Array.isArray(d)?d:(d.results||d.data||[]);out.push(...pointsFromRecords(a,type,type==='event'&&selected.size>0))}catch{}}return out}
function fitAll(geo,pts){const coords=[];for(const f of Object.values(geo||{})){if(f?.features)coords.push(...f.features.flatMap(f=>{const b=d3.geoBounds(f);return[[b[0][0],b[0][1]],[b[1][0],b[1][1]]]}))}coords.push(...pts.map(p=>[p.lon,p.lat]));if(!coords.length)return;const fc={type:'FeatureCollection',features:coords.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:c}}))};projection.fitExtent([[24,70],[width()-24,height()-24]],fc)}
function draw(geo,pts){g.selectAll('*').remove();for(const[k,v]of Object.entries(geo||{})){if(!v?.features)continue;g.append('g').selectAll('path').data(v.features).join('path').attr('d',path).attr('fill',k==='plazas'?'#e5dacb':'none').attr('stroke','#8f8276').attr('stroke-width',k==='streets'?1:1.5).attr('opacity',k==='streets'?.55:.7)}const groups={camp:[],art:[],event:[],mv:[]};pts.forEach(p=>groups[p.type]?.push(p));for(const[type,a]of Object.entries(groups)){g.append('g').selectAll('circle').data(a).join('circle').attr('cx',p=>projection([p.lon,p.lat])[0]).attr('cy',p=>projection([p.lon,p.lat])[1]).attr('r',p=>p.selected?7:(type==='event'?4:5)).attr('fill',type==='camp'?'#b58b64':type==='art'?'#9a79a9':type==='mv'?'#b96e63':'#6f93a7').attr('stroke',p=>p.selected?'#352f2a':'#fbf8f2').attr('stroke-width',p=>p.selected?2.5:1.2).append('title').text(p=>p.name+' — '+p.details)}const n=pts.filter(p=>p.type==='event').length;status.textContent=n?`${n} selected event location${n===1?'':'s'} · ${navigator.onLine?'Online':'Offline'}`:`${pts.length} mapped records · ${navigator.onLine?'Online':'Offline'}`}
async function refresh(){currentGeo=await loadGeo();currentPts=await loadRecords();fitAll(currentGeo,currentPts);draw(currentGeo,currentPts)}await refresh();document.querySelector('#fit').onclick=()=>{fitAll(currentGeo,currentPts);draw(currentGeo,currentPts)};window.addEventListener('message',async e=>{if(e.data?.type==='fit'){fitAll(currentGeo,currentPts);draw(currentGeo,currentPts)}if(e.data?.type==='refresh'){await refresh()}});window.addEventListener('storage',()=>refresh());let zoom=d3.zoom().scaleExtent([.5,20]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);
</script></body></html>
