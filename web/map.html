<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee5d9"><title>Black Rock City 2026 Map</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352f2a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eee5d9}#wrap{height:100%;position:relative;background:#eee5d9}#map{width:100%;height:100%;display:block;touch-action:none;background:#eee5d9}.controls{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.control,.status{background:#fbf8f2;border:1px solid #ded3c4;border-radius:12px;padding:9px 11px;font-weight:700;color:#352f2a;box-shadow:0 3px 14px #3b302814}.status{font-size:12px;font-weight:600;color:#81776d;margin-left:auto}.legend{position:absolute;z-index:5;left:12px;bottom:12px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:10px 12px;font-size:12px;box-shadow:0 3px 14px #3b302814}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bd554f;border:2px solid #fff;box-shadow:0 0 0 1px #bd554f;margin-right:5px}.popup{position:absolute;z-index:8;display:none;min-width:220px;max-width:300px;background:#fbf8f2;border:1px solid #ded3c4;border-radius:15px;padding:13px;box-shadow:0 10px 40px #3b302833}.popup strong{display:block}.popup small{display:block;color:#81776d;margin-top:5px}.popup button{margin-top:9px;border:1px solid #ded3c4;border-radius:10px;background:#eee5d9;padding:7px 10px}.tbd{position:absolute;z-index:5;right:12px;bottom:12px;max-width:260px;max-height:120px;overflow:auto;background:#fbf8f2;border:1px solid #ded3c4;border-radius:14px;padding:9px 11px;font-size:11px;color:#81776d;display:none}.tbd div{padding-top:4px}.gisStreet{fill:none;stroke:#b6aa9d;stroke-width:1.2}.gisAvenue{fill:none;stroke:#9e9081;stroke-width:2.4}.gisPlaza{fill:#e3d7c8;stroke:#c9b9a7;stroke-width:1}.gisFence{fill:none;stroke:#b7a897;stroke-width:2;stroke-dasharray:6 5}.gisLabel{font-size:10px;font-weight:700;fill:#75695f}.gisPoi{fill:#8f7b68}.event{fill:#bd554f;stroke:#fff;stroke-width:2}.eventText{font-size:10px;font-weight:700;fill:#352f2a;paint-order:stroke;stroke:#fbf8f2;stroke-width:3px}</style></head><body><div id="wrap"><svg id="map" viewBox="0 0 1000 760" aria-label="Official Black Rock City 2026 GIS map"></svg><div class="controls"><button class="control" id="back">← My Playa</button><button class="control" id="fit">Fit City</button><button class="control" id="fitEvents">Fit My Events</button><button class="control" id="minus">−</button><button class="control" id="plus">+</button><span class="status" id="status">Loading official GIS…</span></div><div class="legend"><strong>2026 BLACK ROCK CITY</strong> · <span><i class="dot"></i>My Events</span></div><div id="tbd" class="tbd"></div><div id="popup" class="popup"></div></div><script src="api-config.js?v=20260824-1"></script><script src="api-bridge.js?v=20260823-2"></script><script>
const svg=document.getElementById('map'),status=document.getElementById('status'),popup=document.getElementById('popup'),tbd=document.getElementById('tbd'),NS='http://www.w3.org/2000/svg';const GIS='https://raw.githubusercontent.com/burningmantech/innovate-GIS-data/master/2026/GeoJSON/';const URLS={streets:GIS+'street_lines.geojson',plazas:GIS+'plazas.geojson',fence:GIS+'trash_fence.geojson',cpns:GIS+'cpns.geojson'};let events=[],chosen=[],view={x:0,y:0,w:1000,h:760},bounds=null;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const selectedIds=()=>{try{return new Set(JSON.parse(localStorage.getItem('playa_selected')||'[]'))}catch{return new Set()}};function add(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}function coords(g,out=[]){if(!g)return out;if(g.type==='Point')out.push(g.coordinates);else if(g.coordinates)g.coordinates.forEach(x=>Array.isArray(x)&&typeof x[0]==='number'?out.push(x):coords({coordinates:x},out));return out}function collect(fc){const a=[];(fc.features||[]).forEach(f=>coords(f.geometry,a));return a}function updateBounds(fcs){const pts=fcs.flatMap(collect);if(!pts.length)return;let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;pts.forEach(([x,y])=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)});const dx=(maxx-minx)*.04,dy=(maxy-miny)*.04;bounds=[minx-dx,miny-dy,maxx+dx,maxy+dy]}function project(c){if(!bounds)return null;const[minx,miny,maxx,maxy]=bounds;return{x:70+(c[0]-minx)/(maxx-minx)*860,y:690-(c[1]-miny)/(maxy-miny)*620}}function pathFor(g){if(!g)return'';if(g.type==='LineString')return'M '+g.coordinates.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ');if(g.type==='Polygon')return g.coordinates.map(r=>r.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ')+' Z').join(' ');if(g.type==='MultiLineString')return g.coordinates.map(r=>'M '+r.map(c=>{const p=project(c);return p?`${p.x} ${p.y}`:''}).filter(Boolean).join(' L ')).join(' ');if(g.type==='MultiPolygon')return g.coordinates.flatMap(p=>p.map(r=>r.map(c=>{const q=project(c);return q?`${q.x} ${q.y}`:''}).filter(Boolean).join(' L ')+' Z')).join(' ');return''}function renderGeo(fc,type){(fc.features||[]).forEach(f=>{const d=pathFor(f.geometry),p=f.properties||{};if(!d)return;if(type==='street')add('path',{d,class:p.kind==='avenue'?'gisAvenue':'gisStreet'});else if(type==='plaza')add('path',{d,class:'gisPlaza'});else if(type==='fence')add('path',{d,class:'gisFence'});else if(type==='cpn'){const pts=collect(f);if(pts[0]){const q=project(pts[0]);const c=add('circle',{cx:q.x,cy:q.y,r:2.5,class:'gisPoi'});if(p.name){const t=add('text',{x:q.x+5,y:q.y+3,class:'gisLabel'});t.textContent=p.name}}}})}function radius(letter){const i='ABCDEFGHIJK'.indexOf(String(letter||'').toUpperCase().trim().charAt(0));return i<0?.82:.17+i*.065}function clock(v){const m=String(v||'').match(/(\d{1,2})(?::(\d{2}))?/);return m?(Number(m[1])%12)+Number(m[2]||0)/60:null}function eventPoint(loc){let s='';if(typeof loc==='string')s=loc;else if(loc&&typeof loc==='object')s=loc.location_string||((loc.frontage&&loc.intersection)?`${loc.frontage} ${loc.intersection_type||'&'} ${loc.intersection}`:'');s=String(s||'').replace(/\s+/g,' ').trim();if(!s)return null;const center=project([-119.207871,40.783242]);if(/center camp|center camp plaza|the man|man plaza/i.test(s))return center;const a=s.match(/(\d{1,2}(?::\d{2})?)\s*(?:&|and|at)\s*([A-K])\b/i),b=s.match(/([A-K])\s*(?:&|and|at)\s*(\d{1,2}(?::\d{2})?)/i);let h=null,r=.5;if(a){h=clock(a[1]);r=radius(a[2])}else if(b){h=clock(b[2]);r=radius(b[1])}if(h===null||!center)return null;const ang=(h*30-90)*Math.PI/180;return{x:center.x+310*r*Math.cos(ang),y:center.y+230*r*Math.sin(ang)}}function marker(e,p){const g=add('g',{class:'marker'});add('circle',{cx:p.x,cy:p.y,r:8,class:'event'},g);const t=add('text',{x:p.x+11,y:p.y+4,class:'eventText'},g);t.textContent=(e.title||'Event').slice(0,26);g.addEventListener('click',ev=>{ev.stopPropagation();popup.innerHTML=`<strong>${esc(e.title)}</strong><small>📍 ${esc(e.location||e.camp||'Approximate location')}</small><small>${esc(e.date)} · ${esc(e.start)}–${esc(e.end||e.start)}</small><button>Close</button>`;popup.style.display='block';popup.style.left='50%';popup.style.top='62px';popup.style.transform='translateX(-50%)';popup.querySelector('button').onclick=()=>popup.style.display='none'})}function renderEvents(){const ids=selectedIds();chosen=[];let missing=[];events.forEach(e=>{if(!ids.has(e.id))return;const p=eventPoint(e.location||e.location_string||e.location_data||e.other_location);if(p){chosen.push({...e,...p});marker(e,p)}else missing.push(e)});status.textContent=`Official GIS loaded · ${ids.size} selected · ${chosen.length} mapped${missing.length?' · '+missing.length+' TBD':''}`;tbd.style.display=missing.length?'block':'none';tbd.innerHTML=missing.length?'<strong>Location TBD</strong>'+missing.map(e=>`<div>${esc(e.title)}</div>`).join(''):''}function apply(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function fitCity(){view={x:0,y:0,w:1000,h:760};apply()}function fitEvents(){if(!chosen.length){fitCity();return}const xs=chosen.map(p=>p.x),ys=chosen.map(p=>p.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),pad=90;view={x:Math.max(0,minx-pad),y:Math.max(0,miny-pad),w:Math.min(1000,Math.max(300,maxx-minx+pad*2)),h:Math.min(760,Math.max(240,maxy-miny+pad*2))};if(view.x+view.w>1000)view.x=1000-view.w;if(view.y+view.h>760)view.y=760-view.h;apply()}function zoom(f){const nw=Math.max(240,Math.min(1000,view.w*f)),nh=Math.max(180,Math.min(760,view.h*f));view.x=Math.max(0,Math.min(1000-nw,view.x+(view.w-nw)/2));view.y=Math.max(0,Math.min(760-nh,view.y+(view.h-nh)/2));view.w=nw;view.h=nh;apply()}document.getElementById('fit').onclick=fitCity;document.getElementById('fitEvents').onclick=fitEvents;document.getElementById('plus').onclick=()=>zoom(.8);document.getElementById('minus').onclick=()=>zoom(1.25);document.getElementById('back').onclick=()=>window.parent.postMessage({type:'show-itinerary'},'*');window.addEventListener('storage',renderEvents);window.addEventListener('message',e=>{if(e.data?.type==='refresh-map')renderEvents();if(e.data?.type==='fit')fitCity()});svg.addEventListener('click',()=>popup.style.display='none');(async()=>{try{const[street,plaza,fence,cpn,er]=await Promise.all([fetch(URLS.streets).then(r=>r.json()),fetch(URLS.plazas).then(r=>r.json()),fetch(URLS.fence).then(r=>r.json()),fetch(URLS.cpns).then(r=>r.json()),fetch('./data/events.json',{cache:'no-store'}).then(r=>r.json())]);updateBounds([street,fence,plaza]);svg.innerHTML='';add('rect',{x:0,y:0,width:1000,height:760,fill:'#eee5d9'});renderGeo(fence,'fence');renderGeo(plaza,'plaza');renderGeo(street,'street');renderGeo(cpn,'cpn');events=Array.isArray(er)?er:(er.events||er.data||[]);renderEvents();fitCity();const apiOk=window.PLAYA_API?await window.PLAYA_API.health():false;status.textContent=`Official GIS loaded · API ${apiOk?'connected':'offline'} · ${selectedIds().size} selected`; }catch(e){console.error(e);status.textContent='Official GIS unavailable — using fallback';fitCity()}})();</script></body></html>
