<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>PlayaOS</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#111;color:#eee}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.wrap{max-width:900px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto}.nav button{background:#222;color:#eee}.nav .on{background:#f5b942;color:#111}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:14px;margin:10px 0}.meta{color:#aaa;font-size:13px}.tag{display:inline-block;background:#292929;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}.add{background:#f5b942;color:#111}.remove{background:#552222;color:#fff}.danger{color:#ff8b8b}.ok{color:#9be09b}input,select,textarea{width:100%;box-sizing:border-box;background:#222;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;margin:5px 0}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:#aaa}</style></head><body><div id="root"></div><script src="app.js"></script></body></html>
